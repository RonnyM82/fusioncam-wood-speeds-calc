<!doctype html>
<!-- The public page, rebuilt on the Livetools React parts (docs/CONVERSION_PLAN.md).
     The page as it was before the conversion is legacy.html, unchanged, kept
     for comparison until the conversion is done. Density and theme are
     written here as well as by the provider, so the first paint matches.
     data-lt-scheme is left off on purpose: the page follows the device's
     light or dark setting, the tokens do that on their own until React
     mounts, and the provider then writes the scheme it resolved. -->
<html lang="en" data-lt-density="comfortable" data-lt-theme="operational">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CNC Router Speeds &amp; Feeds Calculator</title>
    <meta name="description" content="Free speeds and feeds calculator for solid carbide cutters on nested-base CNC routers. Every number traces to a published source." />
  </head>
  <body>
    <noscript>This calculator needs JavaScript turned on to show anything. Turn it on and reload.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
